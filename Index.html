<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>ULTIMATE UPLOAD: QUANTUM ARCHITECT</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { width: 100vw; height: 100vh; }
        #warn { position: absolute; top: 50%; width: 100%; text-align: center; color: #f00; font-family: 'Courier New'; }
        button { background: #000; border: 1px solid #f00; color: #f00; padding: 20px; cursor: pointer; letter-spacing: 5px; }
    </style>
</head>
<body>
    <div id="warn"><button onclick="ignite()">EXECUTE SYSTEM MODIFICATION</button></div>
    <canvas id="stage"></canvas>

    <script>
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        let audio, t = 0;

        function ignite() {
            document.getElementById('warn').style.display = 'none';
            audio = new (window.AudioContext || window.webkitAudioContext)();
            
            // MASTER AUDIO LAYER
            const m = audio.createChannelMerger(2);
            // 963 Hz - High Frequency Awakening
            playTone(963, 963.5, 0.2, m);
            // 40 Hz - Gamma Processing
            playTone(200, 240, 0.4, m);
            // 7.83 Hz - Earth Resonance (Stabilizer)
            playTone(60, 67.83, 0.3, m);
            m.connect(audio.destination);
            
            loop();
        }

        function playTone(l, r, v, m) {
            const oL = audio.createOscillator(), oR = audio.createOscillator();
            const g = audio.createGain(); g.gain.value = v;
            oL.frequency.value = l; oR.frequency.value = r;
            oL.connect(g); oR.connect(g);
            g.connect(m, 0, 0); g.connect(m, 0, 1);
            oL.start(); oR.start();
        }

        function loop() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            t += 0.03;
            
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.translate(canvas.width/2, canvas.height/2);

            // Vykreslování strukturálního pole
            for(let i = 0; i < 200; i++) {
                let angle = i * 0.1 + t;
                let r = Math.sqrt(i) * 30;
                let x = Math.cos(angle * Math.sin(t * 0.1)) * r;
                let y = Math.sin(angle) * r;
                
                let size = Math.sin(t + i * 0.5) * 5 + 5;
                ctx.fillStyle = i % 2 === 0 ? '#00FF41' : '#FFFFFF';
                
                // Vytváření interference
                ctx.globalAlpha = Math.random() > 0.9 ? 1 : 0.4;
                ctx.fillRect(x, y, size, size);
                
                if(i % 10 === 0) {
                    ctx.strokeStyle = '#00FF41';
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    ctx.lineTo(x,y);
                    ctx.stroke();
                }
            }
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
